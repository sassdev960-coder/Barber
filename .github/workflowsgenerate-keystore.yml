name: Generate Keystore (ONE TIME ONLY)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Alias del keystore (ej: noir)'
        required: true
        default: 'noir'
      validity_years:
        description: 'Años de validez (Play Store recomienda 25+)'
        required: true
        default: '25'
      organization:
        description: 'Nombre de la organización'
        required: true
        default: 'NOIR Barber'

jobs:
  generate:
    name: Generate Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Generate random passwords
        id: pass
        run: |
          STORE_PASS=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 28)
          KEY_PASS=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 28)
          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT
          echo "Contraseñas generadas"

      - name: Generate keystore
        run: |
          DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))
          keytool -genkeypair -v \
            -keystore noir-release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -storepass "${{ steps.pass.outputs.store_pass }}" \
            -keypass "${{ steps.pass.outputs.key_pass }}" \
            -storetype PKCS12 \
            -dname "CN=${{ github.event.inputs.organization }}, OU=Mobile, O=${{ github.event.inputs.organization }}, L=Santa Cruz, ST=Santa Cruz, C=BO"

      - name: Verify keystore with passwords
        run: |
          echo "=== Verificando que el keystore se puede leer ==="
          keytool -list -v \
            -keystore noir-release.keystore \
            -storepass "${{ steps.pass.outputs.store_pass }}" \
            -alias "${{ github.event.inputs.alias }}" \
            | head -20
          echo ""
          echo "✅ Keystore válido y contraseñas verificadas"

      - name: Encode to base64 (single line)
        run: |
          # base64 -w0 = sin saltos de línea (una sola línea)
          base64 -w0 noir-release.keystore > keystore.b64
          SIZE=$(wc -c < keystore.b64)
          LINES=$(wc -l < keystore.b64)
          echo "Base64 generado: $SIZE caracteres, $LINES líneas"
          if [ "$LINES" -gt 0 ]; then
            echo "⚠️ ADVERTENCIA: el base64 tiene saltos de línea"
          else
            echo "✅ Base64 en una sola línea (correcto)"
          fi
          echo "Últimos 4 caracteres: $(tail -c 4 keystore.b64)"

      - name: Generate credentials file
        run: |
          cat > CREDENTIALS.txt <<'CREDENTIALS_EOF'
          ============================================================
          NOIR ADMIN · CREDENCIALES DEL KEYSTORE
          ============================================================

          ⚠️  GUARDA ESTE ARCHIVO EN 3 LUGARES SEGUROS:
             1. USB física
             2. Nube privada (Drive/Dropbox)
             3. Papel impreso en un cajón

          SI LO PIERDES NO PODRÁS ACTUALIZAR LA APP EN PLAY STORE.

          ============================================================
          GitHub Secrets — Ve a:
          Repo → Settings → Secrets and variables → Actions
          ============================================================

          ------------------------------------------------------------
          1) KEYSTORE_PASSWORD
          ------------------------------------------------------------
          CREDENTIALS_EOF
          echo "${{ steps.pass.outputs.store_pass }}" >> CREDENTIALS.txt
          cat >> CREDENTIALS.txt <<'CREDENTIALS_EOF'

          ------------------------------------------------------------
          2) KEY_ALIAS
          ------------------------------------------------------------
          CREDENTIALS_EOF
          echo "${{ github.event.inputs.alias }}" >> CREDENTIALS.txt
          cat >> CREDENTIALS.txt <<'CREDENTIALS_EOF'

          ------------------------------------------------------------
          3) KEY_PASSWORD
          ------------------------------------------------------------
          CREDENTIALS_EOF
          echo "${{ steps.pass.outputs.key_pass }}" >> CREDENTIALS.txt
          cat >> CREDENTIALS.txt <<'CREDENTIALS_EOF'

          ------------------------------------------------------------
          4) KEYSTORE_BASE64
          ------------------------------------------------------------
          IMPORTANTE: NO copiar del log, usa el archivo
          "keystore.b64" del artifact descargable.
          Pega el contenido COMPLETO en una sola línea.
          ------------------------------------------------------------
          CREDENTIALS_EOF
          cat CREDENTIALS.txt

      - name: Show summary in GitHub
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<SUMMARY_EOF
          # 🔐 Keystore generado exitosamente

          ## ⚠️ GUARDA ESTOS DATOS AHORA

          Copia estos valores a los **GitHub Secrets** del repo:

          | Secreto | Valor |
          |---------|-------|
          | \`KEYSTORE_PASSWORD\` | \`${{ steps.pass.outputs.store_pass }}\` |
          | \`KEY_ALIAS\` | \`${{ github.event.inputs.alias }}\` |
          | \`KEY_PASSWORD\` | \`${{ steps.pass.outputs.key_pass }}\` |
          | \`KEYSTORE_BASE64\` | Ver artifact \`keystore.b64\` |

          ## 📦 Cómo obtener KEYSTORE_BASE64

          1. Baja hasta la sección **Artifacts** al final de esta página
          2. Descarga **noir-keystore-DO-NOT-DELETE.zip**
          3. Descomprime el archivo
          4. Abre **keystore.b64** con un editor de texto (Notepad, VS Code)
          5. Copia **TODO** el contenido (debe ser UNA sola línea muy larga)
          6. Pégalo en el secret \`KEYSTORE_BASE64\`

          ## 🔗 Configurar los secretos

          Ve a: Repo → **Settings** → **Secrets and variables** → **Actions** → **New repository secret**

          ## 🚨 Advertencias

          - **NO ejecutes este workflow dos veces** — generará un keystore diferente
          - **NO compartas el keystore** con nadie
          - **NO subas el keystore al repo** (ya está en .gitignore)
          - **Borra este workflow** después de usarlo
          - Si el repo es público, **borra los logs** de esta ejecución después
          SUMMARY_EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noir-keystore-DO-NOT-DELETE
          path: |
            noir-release.keystore
            keystore.b64
            CREDENTIALS.txt
          retention-days: 90

      - name: Final warning
        run: |
          echo ""
          echo "============================================================"
          echo "⚠️  PASOS SIGUIENTES:"
          echo "============================================================"
          echo "1. Descarga el artifact 'noir-keystore-DO-NOT-DELETE'"
          echo "2. Guarda el keystore en 3 lugares seguros"
          echo "3. Copia los 4 valores a GitHub Secrets"
          echo "4. BORRA este workflow para no ejecutarlo por error"
          echo "5. Considera borrar los logs de esta ejecución"
          echo "============================================================"
