name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Verify project structure
        run: |
          echo "=== Archivos en la raíz ==="
          ls -la
          echo "=== package.json ==="
          cat package.json
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json
          echo "=== www/ ==="
          ls -la www/
          echo "=== resources/ (iconos) ==="
          ls -la resources/ || echo "⚠️ No existe resources/ — se usará ícono por defecto"

      - name: Add Android platform
        run: npx cap add android

      # 🔥 NUEVO: Genera íconos y splash personalizados
      - name: Generate custom icons & splash
        run: |
          if [ -f "resources/icon.png" ]; then
            npx @capacitor/assets generate --android \
              --iconBackgroundColor '#ffffff' \
              --iconBackgroundColorDark '#000000' \
              --splashBackgroundColor '#ffffff' \
              --splashBackgroundColorDark '#000000'
            echo "✅ Íconos generados"
          else
            echo "⚠️ No se encontró resources/icon.png — usando íconos por defecto"
          fi

      # Si usas Firebase, descomenta y asegúrate de configurar el plugin
      # - name: Decode google-services.json
      #   run: |
      #     echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>|' "$MANIFEST"
            echo "✅ Permisos agregados al manifest"
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Verify www copied to android assets
        run: |
          echo "=== Verificando que www/ se copió ==="
          ls -la android/app/src/main/assets/public/ || echo "❌ www/ NO se copió"
          head -n 20 android/app/src/main/assets/public/index.html || true

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Grant execute to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noir-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
