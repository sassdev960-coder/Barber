name: Build Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB (unsigned)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Verify structure
        run: |
          echo "=== Raíz ==="
          ls -la
          echo "=== www/ ==="
          ls -la www/
          echo "=== resources/ ==="
          ls -la resources/ || echo "Sin resources/"

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ ya existe, se reutiliza"
          fi

      - name: Generate icons and splash
        run: |
          if [ -f "resources/icon.png" ]; then
            npx @capacitor/assets generate --android \
              --iconBackgroundColor '#0a0a0a' \
              --iconBackgroundColorDark '#0a0a0a' \
              --splashBackgroundColor '#0a0a0a' \
              --splashBackgroundColorDark '#0a0a0a'
          else
            echo "Sin resources/icon.png — usando ícono por defecto"
          fi

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json
          echo "google-services.json OK ($(wc -c < android/app/google-services.json) bytes)"

      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>|' "$MANIFEST"
            echo "Permisos añadidos al manifest"
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties

      - name: Grant execute to gradlew
        run: chmod +x android/gradlew

      # ⚡ AQUÍ ESTÁ LA MAGIA: -x lint y SIN firma
      - name: Build Release AAB (unsigned)
        run: |
          cd android && ./gradlew bundleRelease --no-daemon -x lint

      - name: Locate AAB
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" | head -1)
          echo "AAB encontrado: $AAB_PATH"
          ls -la android/app/build/outputs/bundle/release/

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: noir-admin-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
