name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Verify project structure
        run: |
          echo "=== Archivos en la raíz ==="
          ls -la
          echo "=== package.json ==="
          cat package.json
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json
          echo "=== www/ ==="
          ls -la www/

      - name: Add Android platform
        run: |
          npx cap add android
          echo "=== Verificando que android/ se creó ==="
          ls -la android/
          ls -la android/app/

      - name: Decode google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          echo "google-services.json creado ($(wc -c < android/app/google-services.json) bytes)"
          head -c 100 android/app/google-services.json
          echo ""

      - name: Patch AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's|</manifest>|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>|' "$MANIFEST"
            echo "Permisos agregados al manifest"
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Grant execute to gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noir-admin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
