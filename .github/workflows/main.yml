name: Generate Keystore (ONE TIME ONLY)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Alias del keystore'
        required: true
        default: 'noir'
      validity_years:
        description: 'Años de validez (Play Store recomienda 25+)'
        required: true
        default: '25'
      organization:
        description: 'Nombre de la organización'
        required: true
        default: 'NOIR Barber'

jobs:
  generate:
    name: Generate Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Generate random passwords
        id: pass
        run: |
          STORE_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 28)
          KEY_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 28)
          echo "store_pass=$STORE_PASS" >> $GITHUB_OUTPUT
          echo "key_pass=$KEY_PASS" >> $GITHUB_OUTPUT

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore noir-release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity $(( ${{ github.event.inputs.validity_years }} * 365 )) \
            -storepass "${{ steps.pass.outputs.store_pass }}" \
            -keypass "${{ steps.pass.outputs.key_pass }}" \
            -dname "CN=${{ github.event.inputs.organization }}, OU=Mobile, O=${{ github.event.inputs.organization }}, L=Santa Cruz, ST=Santa Cruz, C=BO"

      - name: Verify keystore
        run: |
          echo "=== Contenido del keystore ==="
          keytool -list -v \
            -keystore noir-release.keystore \
            -storepass "${{ steps.pass.outputs.store_pass }}" | head -30

      - name: Encode to base64
        run: |
          base64 -w0 noir-release.keystore > keystore.b64
          echo "Tamaño base64: $(wc -c < keystore.b64) bytes"

      - name: Generate credentials file
        run: |
          cat > CREDENTIALS.txt <<EOF
          ============================================================
          NOIR ADMIN · CREDENCIALES DEL KEYSTORE
          ============================================================

          GUARDA ESTE ARCHIVO EN UN LUGAR SEGURO (USB + NUBE + PAPEL).
          SI LO PIERDES, NO PODRÁS ACTUALIZAR LA APP EN PLAY STORE.

          ------------------------------------------------------------
          GitHub Secret: KEYSTORE_BASE64
          ------------------------------------------------------------
          (contenido del archivo keystore.b64, ver artifact adjunto)

          ------------------------------------------------------------
          GitHub Secret: KEYSTORE_PASSWORD
          ------------------------------------------------------------
          ${{ steps.pass.outputs.store_pass }}

          ------------------------------------------------------------
          GitHub Secret: KEY_ALIAS
          ------------------------------------------------------------
          ${{ github.event.inputs.alias }}

          ------------------------------------------------------------
          GitHub Secret: KEY_PASSWORD
          ------------------------------------------------------------
          ${{ steps.pass.outputs.key_pass }}

          ============================================================
          Generado: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          ============================================================
          EOF
          cat CREDENTIALS.txt

      - name: Show summary
        run: |
          echo "## 🔐 Keystore generado exitosamente" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ GUARDA ESTOS DATOS AHORA" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secreto | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEYSTORE_PASSWORD\` | \`${{ steps.pass.outputs.store_pass }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEY_ALIAS\` | \`${{ github.event.inputs.alias }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEY_PASSWORD\` | \`${{ steps.pass.outputs.key_pass }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 KEYSTORE_BASE64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Descarga el artifact \`noir-keystore\` y copia el contenido de \`keystore.b64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Añadir a GitHub Secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ve a: \`Settings → Secrets and variables → Actions → New repository secret\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: noir-keystore-DO-NOT-DELETE
          path: |
            noir-release.keystore
            keystore.b64
            CREDENTIALS.txt
          retention-days: 90

      - name: Warning
        run: |
          echo ""
          echo "============================================================"
          echo "⚠️  IMPORTANTE:"
          echo "============================================================"
          echo "1. Descarga el artifact 'noir-keystore-DO-NOT-DELETE'"
          echo "2. Guárdalo en al menos 2 lugares (USB + nube)"
          echo "3. Copia los 4 valores a GitHub Secrets"
          echo "4. NO vuelvas a ejecutar este workflow nunca más"
          echo "5. Considera borrar este archivo después"
          echo "============================================================"
